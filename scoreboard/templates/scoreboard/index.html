<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcador Pádel</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap">
  {% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

  
  <style>
    body {
      font-family: Montserrat, system-ui;
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: url("/static/brand/bg-azul.jpg") center/cover no-repeat;
      color: #fff;
    }
    .box {
      text-align: center;
    }
    .box img.logo {
      height: 200px;
      width: auto;
      display: block;
      margin: 0 auto 20px auto;
    }
    a.btn {
      display: inline-block;
      background: #cbdc00;
      color: #0f172a;
      padding: 14px 22px;
      font-weight: 700;
      border-radius: 14px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    a.btn:hover {
      background: #e6f62b;
    }
    p {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/static/brand/logo-liga.png" alt="Liga" class="logo">
    <h1>Marcador de Pádel</h1>
    <p>Creá un partido nuevo para empezar.</p>
    <a class="btn" href="/nuevo/">➕ Crear partido</a>
  </div>
</body>
</html>
